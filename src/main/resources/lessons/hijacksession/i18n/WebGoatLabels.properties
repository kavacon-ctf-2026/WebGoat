hijacksession.title=Hijack a session

hijacksession.hints.1=Inspect the 'hijack_cookie' value and its Secure and HttpOnly attributes.
hijacksession.hints.2=The cookie is an opaque random value; it is not composed from a counter or timestamp.
hijacksession.hints.3=Compare several newly issued cookies. They should not reveal a predictable sequence.
hijacksession.hints.4=Invalid and expired identifiers are not registered as authenticated sessions.
hijacksession.hints.5=The server binds each active identifier to the signed-in WebGoat account that received it.
hijacksession.sessionissued=A fresh session was issued for your signed-in account. Submit again to verify that cookie.
