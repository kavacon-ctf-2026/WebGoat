<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <div class="lesson-page-wrapper">
        <!-- reuse this lesson-page-wrapper block for each 'page' of content in your lesson -->
        <!-- include content here. Content will be presented via asciidocs files,
        which you put in src/main/resources/plugin/lessonplans/{lang}/{fileName}.adoc -->
        <div class="adoc-content" th:replace="~{doc:lessons/insecurelogin/documentation/InsecureLogin_Intro.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <!-- stripped down without extra comments -->
        <div class="adoc-content" th:replace="~{doc:lessons/insecurelogin/documentation/InsecureLogin_Task.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
            <p>Set a password for your own WebGoat account. The server stores a salted password hash.</p>
            <form class="attack-form" accept-charset="UTF-8" name="register"
                  method="POST" th:action="@{/InsecureLogin/register}">
                <input type="password" name="password" placeholder="New password" minlength="12" maxlength="128" required />
                <input type="password" name="confirmation" placeholder="Confirm password" minlength="12" maxlength="128" required />
                <input type="submit" value="Set password" />
            </form>
            <br />
            <form class="attack-form" accept-charset="UNKNOWN" name="task"
                  method="POST"
                  th:action="@{/InsecureLogin/task}">

                <input type="password" value="" name="password" placeholder="Your password" required />
                <input type="submit" value="Verify password" />

            </form>
            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>
</html>
