insecure-deserialization.title=Insecure Deserialization

insecure-deserialization.invalidversion=The serialized input was rejected by the lesson's safe object filter or is not compatible with the current lesson class. Recreate the lesson object and try again.
insecure-deserialization.expired=The serialized task data is invalid. Please create a fresh lesson object and try again.
insecure-deserialization.wrongobject=Only a VulnerableTaskHolder object is accepted by this lesson endpoint.
insecure-deserialization.stringobject=A plain String is harmless but is not the lesson task object.
insecure-deserialization.actionnotallowed=That task action is not the safe demonstration used by this lesson.
insecure-deserialization.safeaccepted=The serialized lesson object was accepted. Its action remained data and was not executed.


insecure-deserialization.hints.1=Use the org.dummy.insecure.framework.VulnerableTaskHolder class to construct and serialize the lesson object.
insecure-deserialization.hints.2=The VulnerableTaskHolder might have been updated on the server with a next version number.
insecure-deserialization.hints.3=The safe lesson accepts only the inert action string "sleep 5". readObject validates it but never runs it or delays the response.
